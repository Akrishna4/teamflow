paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error or duplicate email
          
  /api/auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /api/projects:
    get:
      summary: Get all projects for current user
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
    post:
      summary: Create a project (Admin only)
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Created

  /api/tasks/project/{projectId}:
    get:
      summary: Get tasks for a project
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: priority
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /api/tasks/my/dashboard:
    get:
      summary: Get user task dashboard (assigned, pending, overdue, completed)
      tags: [Tasks]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: page
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                  groups:
                    type: object
                  hasMore:
                    type: object

  /api/v1/tasks/{taskId}/comments:
    get:
      summary: Get comments for a task
      tags: [Comments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    post:
      summary: Add a comment
      tags: [Comments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, projectId]
              properties:
                content:
                  type: string
                projectId:
                  type: string
      responses:
        '201':
          description: Created

  /api/v1/tasks/{taskId}/checklists:
    post:
      summary: Create a checklist
      tags: [Checklists]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, projectId]
              properties:
                title:
                  type: string
                projectId:
                  type: string
      responses:
        '201':
          description: Created

  /api/v1/projects/{projectId}/labels:
    get:
      summary: Get labels for a project
      tags: [Labels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    post:
      summary: Create a label
      tags: [Labels]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        '201':
          description: Created

  /api/v1/tasks/{taskId}/attachments:
    post:
      summary: Upload an attachment
      tags: [Attachments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                projectId:
                  type: string
      responses:
        '201':
          description: Created

  /api/v1/projects/{projectId}/activity:
    get:
      summary: Get project activity history
      tags: [History]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success

  /api/v1/search:
    get:
      summary: Global search (projects and tasks)
      tags: [Search]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        '200':
          description: Success
          
  /api/v1/views:
    get:
      summary: Get saved views for a project
      tags: [Saved Views]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: projectId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
    post:
      summary: Create a saved view
      tags: [Saved Views]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, project, filters]
              properties:
                name:
                  type: string
                project:
                  type: string
                filters:
                  type: object
                sort:
                  type: string
      responses:
        '201':
          description: Created

  /health:
    get:
      summary: System health status
      tags: [Monitoring]
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /ready:
    get:
      summary: System readiness probe
      tags: [Monitoring]
      responses:
        '200':
          description: System ready
          
  /metrics:
    get:
      summary: Application metrics (Prometheus format placeholder)
      tags: [Monitoring]
      responses:
        '200':
          description: Metrics returned
